[project]
name = "mandahands"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
  "mujoco==3.15.0",
  "mujoco-warp==3.15.0",
  "warp-lang==1.18.0",
  "numpy",
  "trimesh",
  "pycollada",  # .dae meshes in real-hand sources
  "lxml",
  "scipy",
  "coacd",
  "pillow",
  "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mandahands*"]
